name: Module checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, openssl, zip, simplexml
          coverage: none
          tools: composer:v2
      - run: composer --working-dir=kopokopo --no-plugins --no-scripts validate --strict
      - run: php scripts/check.php
      - run: php tests/run.php
      - run: php tests/settings.php
      - run: php tests/requirements.php
      - run: node --check kopokopo/views/js/status.js
      - run: php scripts/build.php
      - run: php tests/package.php
