name: Build merchant ZIP
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, json, openssl, zip, simplexml
          coverage: none
      - run: php scripts/check.php
      - run: php tests/run.php
      - run: php tests/settings.php
      - name: Check tag matches module version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: php -r '$version = (string) simplexml_load_file("kopokopo/config.xml")->version; if (getenv("RELEASE_TAG") !== "v" . $version) { exit(1); }'
      - run: php scripts/build.php
      - run: php tests/package.php
      - uses: actions/upload-artifact@v7
        with:
          name: kopokopo-merchant-package
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
